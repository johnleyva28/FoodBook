name: foodbook
description: "Registro diario de comidas y gastos en la pensión."
publish_to: 'none' # This is preferred for private packages.

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM - ViewModels)
  provider: ^6.1.2

  # Local database (SQLite, type-safe)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # File locations (to store the database)
  path_provider: ^2.1.4
  path: ^1.9.0

  # Date formatting (es_PE)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for drift
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true